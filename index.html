<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Una cita contigo</title>
<style>
:root{color-scheme:light dark;--bg1:#f9c7d9;--bg2:#cbbcf6;--ink:#4b3545;--muted:#826979;--card:rgba(255,255,255,.94);--pink:#e887ad;--pink2:#d86d9a;--line:#f1dbe5;--shadow:0 24px 70px rgba(101,57,91,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"Avenir Next",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}body{overflow-x:hidden;background:#f7d1df}
#app{min-height:100vh;min-height:100svh;background:linear-gradient(135deg,var(--bg1),#f7dff0 45%,var(--bg2));position:relative;overflow:hidden;display:grid;place-items:center;padding:24px}
#app:before,#app:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.42;pointer-events:none}#app:before{width:330px;height:330px;background:#fff;left:-100px;top:-100px}#app:after{width:420px;height:420px;background:#f7a7c7;right:-180px;bottom:-180px}
.decor{position:absolute;inset:0;pointer-events:none;overflow:hidden}.heart{position:absolute;color:rgba(255,255,255,.62);font-size:clamp(20px,3vw,42px);animation:float 7s ease-in-out infinite}.h1{left:8%;top:16%}.h2{right:10%;top:13%;animation-delay:1.4s}.h3{left:15%;bottom:14%;animation-delay:2.4s}.h4{right:16%;bottom:19%;animation-delay:3.2s}.spark{position:absolute;color:#fff;opacity:.75;font-size:18px}.s1{left:25%;top:11%}.s2{right:27%;bottom:13%}.s3{left:9%;top:55%}
.card{position:relative;z-index:2;width:min(650px,100%);min-height:540px;padding:clamp(30px,6vw,62px);background:var(--card);border:1px solid rgba(255,255,255,.8);border-radius:32px;box-shadow:var(--shadow);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}.card:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#ffe9f2;top:-90px;right:-60px;z-index:-1}.content{width:100%;animation:enter .45s ease both}.eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--pink2);font-weight:800;margin-bottom:16px}.icon{font-size:48px;line-height:1;margin-bottom:16px}.title{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(2rem,6vw,3.4rem);line-height:1.08;margin:0 auto 16px;max-width:580px;color:#553b4c;text-shadow:0 4px 22px rgba(216,109,154,.13)}.subtitle{color:var(--muted);font-size:1.02rem;line-height:1.65;max-width:470px;margin:0 auto 28px}.buttons{display:flex;justify-content:center;align-items:center;gap:14px;min-height:90px;position:relative}.btn{appearance:none;border:0;border-radius:999px;padding:14px 25px;font:inherit;font-weight:800;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease,background .22s ease;touch-action:manipulation}.yes{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;box-shadow:0 12px 25px rgba(216,109,154,.28);position:relative;z-index:2}.yes:hover{transform:translateY(-2px);box-shadow:0 15px 30px rgba(216,109,154,.35)}.no{background:#fff;color:#8b6c7d;border:1px solid var(--line);position:absolute;z-index:3;white-space:nowrap}.hint{font-size:.78rem;color:#a98d9d;margin-top:10px}.field{margin:22px auto 28px;max-width:330px;text-align:left}.field label{display:block;font-size:.85rem;font-weight:800;color:#76596a;margin:0 0 8px 8px}.field input,.food{width:100%;border:1px solid var(--line);background:#fff;border-radius:17px;padding:15px 16px;font:inherit;color:var(--ink);outline:none}.field input:focus{border-color:#df91b1;box-shadow:0 0 0 4px rgba(232,135,173,.14)}.primary{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;box-shadow:0 10px 24px rgba(216,109,154,.25)}.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.foods{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:440px;margin:24px auto 30px}.food{cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;font-weight:700;transition:.2s}.food:hover{transform:translateY(-2px);border-color:#e5a0bc}.food input{accent-color:#d86d9a}.letter{font-family:Georgia,"Times New Roman",serif;font-size:1.08rem;line-height:1.85;text-align:left;max-width:510px;margin:20px auto 28px;color:#614554;background:linear-gradient(135deg,rgba(255,245,249,.9),rgba(255,255,255,.65));border:1px solid #f5dce7;border-radius:24px;padding:24px 26px;box-shadow:0 14px 32px rgba(101,57,91,.08);position:relative}.letter:before{content:"“";position:absolute;left:14px;top:-16px;font-size:5rem;line-height:1;color:#eaa5bf;opacity:.55}.letter p{margin:0 0 16px}.letter p:last-child{margin-bottom:0}.signature{text-align:right;color:#b46b8d;font-style:italic}.choices{font-size:.84rem;color:#a27f91;margin-top:14px}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-14px) rotate(5deg)}}
@media(max-width:560px){#app{padding:14px}.card{min-height:600px;padding:38px 20px;border-radius:26px}.buttons{min-height:130px}.foods{grid-template-columns:1fr}.title{font-size:2.25rem}.letter{font-size:1rem;line-height:1.7}.progress{left:18px;right:18px;top:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(prefers-color-scheme:dark){:root{--ink:#f5eaf0;--muted:#d0b9c6;--card:rgba(49,35,48,.95);--line:#634d5b;--bg1:#5e3349;--bg2:#443d6c}body{background:#4d3043}.card:before{background:#62404f}.field input,.food{background:#3c2b39;color:#f5eaf0}.no{background:#3c2b39;color:#d8bfcc}}
.music-player{position:fixed;right:18px;bottom:18px;z-index:10;width:min(320px,calc(100vw - 36px));padding:12px;background:rgba(255,255,255,.94);border:1px solid #f1dbe5;border-radius:16px;box-shadow:0 8px 24px rgba(101,57,91,.2);color:#614554}
.music-player audio{display:block;width:100%;height:40px}
.music-label{font-size:.82rem;font-weight:800;margin:0 0 6px}
</style>
</head>
<body>
<main id="app">
<div class="decor" aria-hidden="true"><span class="heart h1">♡</span><span class="heart h2">♥</span><span class="heart h3">♡</span><span class="heart h4">♥</span><span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span></div>
<section class="card" aria-live="polite"><div class="progress" aria-hidden="true"><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div id="content"></div></section>
</main>
 <div class="music-player">
  <p class="music-label">♫ Hasta la raíz</p>
  <audio controls preload="metadata">
    <source src="hasta-la-raiz.mp3" type="audio/mpeg">
    Tu navegador no puede reproducir este archivo de audio.
  </audio>
</div>
<script>
const content=document.getElementById('content'),dots=[...document.querySelectorAll('.dot')];
let step=1,yesScale=1,date='',food='',customFood='',emailStatus='';
const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setStep(n){step=n;dots.forEach((d,i)=>d.classList.toggle('active',i<n));render()}
function render(){
 if(step===1){content.innerHTML=`<div class="content"><div class="icon">💌</div><div class="eyebrow">Una pequeña pregunta, una gran ilusión</div><h1 class="title">¿Qué día quieres celebrar tu despedida conmigo? ♡</h1><p class="subtitle">Te prometo un día bonito, lleno de sorpresas, comida rica y ganas de pasarlo bien. ✨</p><div class="buttons" id="arena"><button class="btn yes" id="yes" style="transform:scale(${yesScale})">¡Sí!</button><button class="btn no" id="no">¡No!</button></div><div class="hint">Pista: creo que ya sé qué respuesta quiero escuchar… 💕</div></div>`;setupNo();document.getElementById('yes').onclick=()=>setStep(2)}
 if(step===2){content.innerHTML=`<div class="content"><div class="icon">🌷✨</div><div class="eyebrow">Paso 2 · El momento perfecto</div><h1 class="title">¿Qué día te apetece? 💕</h1><p class="subtitle">Busca un día que te haga ilusión. La fecha será solo nuestra excusa para crear un recuerdo bonito.</p><div class="field"><label for="date">♡ Elige nuestra fecha</label><input id="date" type="date" min="${new Date().toISOString().split('T')[0]}" value="${esc(date)}"></div><button class="btn primary" id="day" disabled>¡Ese día! 🌸</button></div>`;const inp=document.getElementById('date'),b=document.getElementById('day');inp.oninput=()=>{date=inp.value;b.disabled=!date};b.onclick=()=>date&&setStep(3)}
 if(step===3){content.innerHTML=`<div class="content"><div class="icon">🍽️💗</div><div class="eyebrow">Paso 3 · Un poquito de mimo</div><h1 class="title">¿Qué te apetece comer? 😋</h1><p class="subtitle">Porque una cita bonita también necesita algo rico. Elige una opción o escribe lo que te apetezca si ninguna te convence.</p><div class="foods">${[['canelones','🥘','Canelones'],['sopa','🍲','Sopa'],['seitan','🌱','Seitán al horno'],['pizza','🍕','Pizza'],['otra','✍️','Otra opción']].map(([v,e,l])=>`<label class="food"><input type="radio" name="food" value="${v}" ${food===v?'checked':''}> <span>${e} ${l}</span></label>`).join('')}</div><div class="field" id="customFoodField" style="display:${food==='otra'?'block':'none'}"><label for="customFood">♡ ¿Qué te apetece?</label><input id="customFood" type="text" maxlength="180" placeholder="Escribe aquí tu antojo…" value="${esc(customFood)}"></div><button class="btn primary" id="finish" disabled>Quiero esa ♡</button></div>`;const fs=[...document.querySelectorAll('input[name=food]')],b=document.getElementById('finish'),cf=document.getElementById('customFood'),cfield=document.getElementById('customFoodField');function updateFood(){const selected=document.querySelector('input[name=food]:checked');food=selected?selected.value:'';cfield.style.display=food==='otra'?'block':'none';b.disabled=!food||(food==='otra'&&!customFood.trim())}fs.forEach(x=>x.onchange=updateFood);cf.oninput=()=>{customFood=cf.value;updateFood()};updateFood();b.onclick=()=>{if(!food||(food==='otra'&&!customFood.trim()))return;setStep(4);sendResponse()}}
 if(step===4){const pretty=date?new Date(date+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'nuestro día';const names={canelones:'canelones 🥘',sopa:'sopa 🍲',seitan:'seitán al horno 🌱',pizza:'pizza 🍕',otra:customFood.trim()};const chosen=names[food]||'algo rico';content.innerHTML=`<div class="content"><div class="icon">💗✨</div><div class="eyebrow">Una carta escrita con cariño</div><h1 class="title">Entonces… tenemos una cita. 💌</h1><div class="letter"><p>Hay planes que se hacen con una agenda, y otros que simplemente se sienten bien desde el principio.</p><p>Me gustaría compartir contigo <strong>${esc(pretty)}</strong>, sentarnos sin prisa, reírnos de cualquier tontería y disfrutar de ${esc(chosen)}.</p><p>Pero, sobre todo, me apetece estar contigo. Así de sencillo. Así de bonito.</p><p>Gracias por decir que sí a este pequeño plan. Prometo intentar que sea un recuerdo de esos que dan ganas de repetir.</p><p class="signature">Con cariño,<br>alguien que tiene muchas ganas de verte ♡</p></div><p id="emailStatus" class="choices" role="status">Preparando el envío de tu respuesta por correo…</p><button class="btn primary" id="again">Ver de nuevo</button><div class="choices">${esc(pretty)} · ${esc(chosen)}</div></div>`;document.getElementById('again').onclick=()=>{yesScale=1;date='';food='';customFood='';emailStatus='';setStep(1)}}
}
async function sendResponse(){const pretty=date?new Date(date+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'No indicado';const names={canelones:'Canelones',sopa:'Sopa',seitan:'Seitán al horno',pizza:'Pizza',otra:customFood.trim()};const status=document.getElementById('emailStatus');if(status)status.textContent='Enviando la respuesta por correo…';try{const response=await fetch('https://formsubmit.co/ajax/afraalsina99@gmail.com',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({_subject:'Respuesta a la invitación de despedida',Nombre:'Respuesta de la invitación',Fecha_elegida:pretty,Comida_elegida:names[food]||'No indicada',_template:'table'})});const result=await response.json();if(!response.ok||result.success===false)throw new Error('No se ha podido confirmar el envío');if(status)status.textContent='¡Respuesta enviada por correo! 💌';}catch(error){if(status)status.textContent='No se ha podido confirmar el envío automático. Puedes avisarme directamente para comprobarlo. 💌';}}
function setupNo(){const no=document.getElementById('no'),arena=document.getElementById('arena');let moving=false;function move(){if(moving)return;moving=true;yesScale=Math.min(1.65,yesScale+.08);no.style.position='fixed';const pad=16;const w=no.offsetWidth,h=no.offsetHeight;const maxX=Math.max(pad,window.innerWidth-w-pad),maxY=Math.max(pad,window.innerHeight-h-pad);no.style.left=(pad+Math.random()*(maxX-pad))+'px';no.style.top=(pad+Math.random()*(maxY-pad))+'px';no.animate([{transform:'scale(.85) rotate(-8deg)'},{transform:'scale(1.08) rotate(5deg)'},{transform:'scale(1) rotate(0)'}],{duration:280,easing:'ease-out'});document.getElementById('yes').style.transform=`scale(${yesScale})`;setTimeout(()=>moving=false,250)}no.addEventListener('mouseenter',move);no.addEventListener('pointerdown',e=>{e.preventDefault();move()});no.addEventListener('touchstart',e=>{e.preventDefault();move()},{passive:false});window.addEventListener('resize',()=>{if(step===1)move()},{once:true})}
render();
</script>
</body></html>
